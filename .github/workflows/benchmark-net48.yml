name: Benchmark on .NET Framework 4.8

# Manual only. The benchmark project is multi-targeted; this runs it on net48 so the netstandard2.0 asset
# of the library (with its System.Memory reference) is measured on the runtime it actually serves, which
# cannot be run on the development Mac. Shared runners are noisy: read the ratios between arms in one
# run, not the absolute numbers.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter (default: the throughput benchmarks)"
        required: false
        default: "*ThroughputBenchmarks*"

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark (net48, windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build benchmarks/FastBinaryJson.Benchmarks/FastBinaryJson.Benchmarks.csproj -c Release -f net48 --nologo

      # The input goes through an environment variable, never straight into the script: a workflow input is
      # chosen by whoever dispatches the run, and interpolating it into a run block lets it inject commands.
      - name: Benchmark
        env:
          BENCHMARK_FILTER: ${{ inputs.filter }}
        run: >
          dotnet run --no-build -c Release -f net48
          --project benchmarks/FastBinaryJson.Benchmarks/FastBinaryJson.Benchmarks.csproj
          -- bench --filter "$env:BENCHMARK_FILTER" --artifacts artifacts/benchmarks

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-net48
          path: artifacts/benchmarks/results/
          if-no-files-found: error
